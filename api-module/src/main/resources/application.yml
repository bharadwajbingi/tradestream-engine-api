spring:
  application:
    name: trade-file-processing-service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/trade_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      idle-timeout: 30000
      pool-name: HikariCP-Trade

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        jdbc:
          batch_size: 250
          fetch_size: 1000
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0

  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never

  servlet:
    multipart:
      max-file-size: 1GB
      max-request-size: 1GB

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

server:
  port: ${SERVER_PORT:8080}

  compression:
    enabled: true
    mime-types:
      - text/csv
      - text/plain
      - application/json
    min-response-size: 1024

batch:
  trade:
    chunk-size: ${BATCH_TRADE_CHUNK_SIZE:250}

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-time: ${JWT_EXPIRATION_MS:1800000}

  oauth2:
    frontend-redirect-url: ${FRONTEND_REDIRECT_URL:http://localhost:5173/oauth2/redirect}

  totp:
    encryption-key: ${TOTP_ENCRYPTION_KEY}

file:
  upload:
    temp-dir: ${FILE_UPLOAD_TEMP_DIR:./data/uploads/}

rate-limit:
  requests-per-minute: ${RATE_LIMIT_REQUESTS_PER_MINUTE:120}

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health,metrics,info

  endpoint:
    health:
      show-details: when_authorized

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-} jobId:%X{jobId:-}]"

  level:
    org.springframework.security: INFO
    org.hibernate.SQL: INFO

aws:
  s3:
    access-key: ${AWS_S3_ACCESS_KEY:}
    secret-key: ${AWS_S3_SECRET_KEY:}
    region: ${AWS_S3_REGION:ap-southeast-2}
    bucket-name: ${AWS_S3_BUCKET_NAME:tradestream-exports}
