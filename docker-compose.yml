services:
  db:
    image: postgres:15-alpine
    container_name: trade-postgres-db
    restart: unless-stopped

    ports:
      - "5432:5432"

    environment:
      POSTGRES_DB: trade_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trade_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: trade-backend-service
    restart: unless-stopped

    ports:
      - "8080:8080"

    env_file:
      - .env

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/trade_db
      JAVA_OPTS: "-Xms512m -Xmx2g"

    volumes:
      - trade_uploads:/app/temp-uploads

    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  trade_uploads:
